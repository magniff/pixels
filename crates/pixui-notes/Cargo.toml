[package]
name = "pixui-notes"
description = "A markdown note-taking app with vim keys, built entirely on pixui."
version.workspace = true
edition.workspace = true
license.workspace = true

# One dependency, same as the other demo. The vim editor, the markdown parser
# and the file dialogs are all application code built on the toolkit's widgets.
[dependencies]
pixui = { path = "../pixui", features = ["gpu"] }
