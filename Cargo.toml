# The note editor is the root package: `cargo run` at the top of this repo
# starts it. `pixui`, the toolkit it is drawn with, is its own repo beside
# this one - github.com/magniff/pixui - checked out as a sibling directory.
[package]
name = "notes"
description = "A markdown note editor with vim keys, drawn one pixel at a time."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The local model, on by default. It builds llama.cpp from source, so a first
# build wants `cmake` and `clang` and takes a minute; `--no-default-features`
# skips all of that and leaves the assistant as the rehearsal stub, which is
# what the screenshots and the tests run against anyway.
default = ["llm"]
llm = ["dep:llama-cpp-2"]

[dependencies]
pixui = { path = "../pixui", features = ["gpu"] }

# llama.cpp, for running a quantised model on the machine in front of you.
# Metal on Apple silicon, plain CPU elsewhere.
llama-cpp-2 = { version = "0.1.154", optional = true }

# Sublime Text grammars, for highlighting fenced code blocks. Deliberately
# without its themes: syntect's colour schemes are built for a full RGB palette
# and would fight the sixteen warm tones everything else is drawn from. We take
# the scopes and map them ourselves. `regex-fancy` keeps it pure Rust.
[dependencies.syntect]
version = "5"
default-features = false
features = ["parsing", "default-syntaxes", "regex-fancy"]

[workspace]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
